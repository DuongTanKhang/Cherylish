[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:aegis]
environment=ASPNETCORE_ENVIRONMENT="Development"
command=/usr/share/dotnet/dotnet /app/aegis/Aegis.API.dll
environment=ASPNETCORE_URLS="http://+:5130"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:geme-api]
environment=NODE_ENV="development"
command=/bin/sh -c "cd /app/api && node dist/main.js"
directory=/app/api
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:admin]
command=node /app/admin/node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 3001
directory=/app/admin
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
